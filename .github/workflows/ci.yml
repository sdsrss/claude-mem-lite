name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for every job here (audit 2026-09-02 P2-19). This workflow only reads the
# repo: it lints, tests, benchmarks and smoke-tests. `publish.yml` and `sandbox-install.yml`
# already declared theirs; this one was the gap, and it is the workflow that runs on
# `pull_request` — i.e. the one that executes code from a fork's branch after installing
# several thousand dev dependencies' install scripts. No job below uploads a release asset,
# writes a comment or opens an issue; the one job that needs more than this (`sandbox-install`
# wanting `issues: write`) lives in its own file and keeps its own block.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Added with the 2026-09-05 P1-3 reformat (commit 36f8c0f). This is a real gate:
      # it fails the job. Before the reformat it would have failed on 525 of 531 files,
      # which is why the check existed unenforced for two days.
      - run: npm run format:check

      # Informational only — this step cannot fail the job, and nothing reads its
      # output automatically. CLAUDE.md's knip measurement contract records that a
      # `git worktree --detach HEAD` checkout reads ~15 LOWER than the primary
      # working tree on the same commit with the same binary, reproduced and cause
      # never established. CI is a fresh clone: which side it lands on is unknown,
      # so a name-set guard written today would be a bet, not a measurement. Print
      # it for a few rounds first. The NAME SET goes to the log too, not just the
      # count — rule 3 of that contract is that a count is a smoke alarm and the
      # name set is the evidence, and a future guard needs the set.
      #
      # Output goes to RUNNER_TEMP, never the workspace: an untracked file at the
      # repo root changes the case count `tests/obs-id-caliber-sync.test.mjs`
      # generates, which is a real (if here cross-job) way to move a headline number.
      - name: Knip unused-export count (informational — cannot fail the job)
        continue-on-error: true
        run: |
          ./node_modules/.bin/knip --reporter json > "$RUNNER_TEMP/knip-ci.json" || true
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/knip-ci.json','utf8'));const n=d.issues.flatMap(i=>(i.exports||[]).map(e=>i.file+':'+e.name)).sort();console.log('knip unused exports (CI fresh clone):',n.length);console.log('unused files:',d.issues.flatMap(i=>i.files||[]).length);console.log(n.join('\n'))"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck is preinstalled on ubuntu-latest runners. setup.sh's two
      # node -e blocks are single-quoted on purpose (vars passed via env, not
      # shell expansion) and now carry inline `# shellcheck disable=SC2016`
      # directives, so this job gates on a clean exit 0.
      # Enumerated rather than globbed on purpose — a glob would silently start
      # gating files nobody reviewed. Adding a shipped .sh means adding it HERE:
      # pre-agent-inject.sh ran on every Agent dispatch for a whole release before
      # anything linted it.
      - name: ShellCheck shipped scripts
        run: shellcheck scripts/post-tool-use.sh scripts/pre-agent-inject.sh scripts/pre-commit.sh scripts/setup.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Surfaces supply-chain advisories on PRs (production deps only), before
      # the release pipeline's own audit gate. Baseline: 0 vulnerabilities.
      - name: Security audit (production deps)
        run: npm audit --omit=dev

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        # v4.0.0 dropped Node 20 (EOL 2026-04): better-sqlite3 13 requires >=22, and
        # `engines` now says so. 26 joins in the same change — it is the current release
        # line and closes audit A20260905-R5-P3-1, deferred until a matrix edit was due.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always() && matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run benchmark gate
        # `--strict` on PUSH only, and deliberately not on pull_request.
        #
        # On push it matches publish.yml: the tag path must never be the stricter of the
        # two, or a green branch tells you nothing about the release that follows it. A
        # baseline past BASELINE_STALE_AGE_DAYS then fails here first, on main, where
        # recapturing it is a one-line commit. That arms a DATED failure: the age test is
        # `floor((now - baseline.timestamp) / DAY) >= 30` and the baseline is stamped
        # 2026-09-01T16:29:45Z, so main goes red from 2026-10-01 **16:29 UTC** — that
        # morning's pushes are still green. Intended reminder, not automated.
        #
        # It fires HERE FIRST, and that ordering is the mitigation for the release path:
        # publish.yml's gate is also strict, and a strict failure there happens inside
        # `validate` AFTER the tag has been pushed, which strands the tag (expensive — see
        # the v3.69.0/v3.69.1 note in publish.yml). Main going red at day 30 is what stops
        # anyone reaching that state unaware.
        #
        # PRs stay advisory because the same red would otherwise land on an outside
        # contributor for a reason that has nothing to do with their change and that they
        # have no way to clear (this repo started taking external PRs at v3.84.1).
        run: node benchmark/ci-gate.mjs ${{ github.event_name == 'push' && '--strict' || '' }}

  # Real publishable-tarball install: npm pack → clean-dir npm install →
  # better-sqlite3 native rebuild → import entry + open DB. This is the ONLY CI
  # coverage of the real install path — install-e2e.test.mjs uses --dev symlinks
  # (skips npm install) and hook-update.test.mjs mocks all tarball I/O. Guards
  # #8719 lockfile/native-shape drift, better-sqlite3 ABI breaks, and tarball
  # runtime completeness. Runs in parallel (no `needs`): packaging health is
  # orthogonal to the unit suite and should surface even if a unit test is flaky.
  # No `npm ci` — the script packs from the "files" whitelist and installs fresh.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Real tarball install smoke test
        run: node scripts/smoke-tarball.mjs

  # Same smoke on a PRISTINE npm >= 12, where install/lifecycle scripts are
  # blocked by default (empty allow-scripts allowlist). The `smoke` job above runs
  # npm 10 where compilation just works, so without this leg a regression here is
  # invisible to CI and only surfaces as a user-side -32000. Both legs pin the block
  # via `allow-scripts=none` in the throwaway project's .npmrc (npm 12 rejects
  # --allow-scripts/env for project installs with EALLOWSCRIPTS; project .npmrc is the
  # sanctioned pin and beats any ambient runner allowlist).
  #
  # v4.0.0 SPLIT THIS IN TWO, because better-sqlite3 13 ships `prebuilds/<platform>.node`
  # in its own tarball and that retires the failure this job was built on. Measured:
  # `npm install --ignore-scripts better-sqlite3@13` lands 8 prebuilds and opens a DB;
  # the same install of 12 lands none and cannot. So under 13 a blocked script no longer
  # produces a broken binding on any covered platform — the single old assertion
  # ("the heal MUST fire") would now fail outright, and deleting it would have dropped
  # heal coverage silently. Each leg asserts one thing and can fail on its own:
  #
  #   1. prebuilds intact  → the install must come up WITHOUT healing. Guards the
  #      user-facing claim that npm's script block no longer reaches them. The smoke
  #      also proves the block really happened by asserting node-gyp left no
  #      build/Release — the cause, since the broken-binding symptom is gone.
  #   2. prebuilds deleted → stands in for a platform no prebuild covers (exotic
  #      libc/arch), where the shipped heal is still the only thing between the user and
  #      a -32000. Keeps binding-probe / setup.sh 6b / launch.mjs / hook-update covered.
  smoke-npm12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install npm 12
        run: npm install -g npm@^12 && npm --version
      - name: Script block must not reach the user (prebuilds intact, no heal expected)
        env:
          SMOKE_EXPECT_SCRIPT_BLOCK: '1'
        run: node scripts/smoke-tarball.mjs
      - name: Heal path still works where no prebuild covers the platform
        env:
          SMOKE_EXPECT_SCRIPT_BLOCK: '1'
          SMOKE_FORCE_NO_PREBUILDS: '1'
        run: node scripts/smoke-tarball.mjs
