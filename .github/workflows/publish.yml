name: Release

on:
  push:
    tags: ['v*']

permissions:
  # Least privilege for the DEFAULT job token (audit 2026-08-29 SEC-4). `validate`
  # is the only job this covers, and all it does is check out and run npm — with a
  # write-scoped token in a runner that has just executed several thousand dev
  # dependencies' install scripts. The `publish` job declares its own
  # `contents: write` + `id-token: write` block, so tightening here does not touch
  # the release upload or the provenance attestation.
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version consistency
        # FIRST check after install, deliberately (audit 2026-09-02 P2-19). It used to run
        # after lint + the full coverage suite + `npm audit`, which is several minutes of
        # work to reach a verdict that depends on nothing any of them produce. The failure
        # this guards is a MISTAGGED release, and by the time the workflow starts the tag is
        # already pushed — so the only thing the delay bought was a later error message on a
        # mistake that has to be undone in git either way. It needs `npm ci` only because it
        # reads the version out of the manifests with `node -p`.
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          PLUGIN_VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          MARKET_VERSION=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          CLAUDEMD_VERSION=$(grep -oP '^- \*\*Version\*\*: \K[0-9]+\.[0-9]+\.[0-9]+' CLAUDE.md)

          echo "Tag: $VERSION | package.json: $PKG_VERSION | package-lock.json: $LOCK_VERSION | plugin.json: $PLUGIN_VERSION | marketplace.json: $MARKET_VERSION | CLAUDE.md: $CLAUDEMD_VERSION"

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          if [ "$VERSION" != "$LOCK_VERSION" ]; then
            echo "::error::package-lock.json version ($LOCK_VERSION) does not match tag ($VERSION)"
            exit 1
          fi
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::plugin.json version ($PLUGIN_VERSION) does not match tag ($VERSION)"
            exit 1
          fi
          if [ "$VERSION" != "$MARKET_VERSION" ]; then
            echo "::error::marketplace.json version ($MARKET_VERSION) does not match tag ($VERSION)"
            exit 1
          fi
          if [ "$VERSION" != "$CLAUDEMD_VERSION" ]; then
            echo "::error::CLAUDE.md version ($CLAUDEMD_VERSION) does not match tag ($VERSION)"
            exit 1
          fi
          echo "All versions consistent: $VERSION"

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Security audit
        run: npm audit --omit=dev

      - name: Generate npm-shrinkwrap (lock the publishable tarball)
        # npm NEVER packs package-lock.json (even when listed in files[]), so
        # bare `npx` / `npm i` installs of the registry tarball resolved the
        # dependency tree UNLOCKED (only the overrides pins held). npm DOES
        # pack npm-shrinkwrap.json — generate it from the lockfile at release
        # time (not committed) so registry installs get the exact tested tree
        # while dev flow keeps package-lock.json. Marketplace installs were
        # already locked (git clone carries package-lock.json).
        run: npm shrinkwrap

      - name: Smoke-test the publishable tarball
        # Gate the release on the riskiest path: npm pack → real npm install of the
        # tarball → better-sqlite3 native rebuild → import entry points → open a DB.
        # Nothing else here exercises it — install-e2e runs --dev (symlinks, no
        # install), hook-update mocks tarball I/O, completeness is static-only. A
        # missing files[] entry or a native ABI break would otherwise publish a
        # tarball that bricks every fresh `npx`/`npm i` install. (audit MED-4)
        # Runs AFTER npm shrinkwrap so the smoked tarball is the locked shape
        # that publish ships.
        run: node scripts/smoke-tarball.mjs

      - name: Benchmark gate
        # ENG-2 (audit 2026-08-29). ci.yml carries a standalone `benchmark` job, but it
        # gates the BRANCH, not the tag: pushing a tag right after the branch push starts
        # a Release run that does not wait for it, so a retrieval-quality regression can
        # ride out with the release while the branch run is still going.
        #
        # This is systematic, not a one-off — every recent release shows the same overlap
        # (`gh run list`, UTC): v3.84.1 CI 13:55:59Z / Release 13:56:09Z (10s), v3.84.0
        # 18:29:59Z / 18:31:03Z (64s), v3.83.0 19:42:28Z / 19:42:44Z (16s), v3.82.0
        # 17:21:48Z / 17:22:02Z (14s). None of those gaps is long enough for the branch
        # benchmark job to finish.
        #
        # Runs last because it is the only check here that needs the benchmark corpus, not
        # because it is the slowest — measured on a clean `git archive HEAD` tree it is
        # 0.52s, against ~39s for the test matrix and a real `npm install` inside
        # smoke-tarball. (The older comment claimed "slowest check here"; it isn't.)
        # `benchmark/baseline.json` is committed, so this works on a fresh checkout.
        #
        # `--strict` because a stale baseline makes the comparison untrustworthy, and this
        # is exactly the release context `ci-gate.mjs`'s own docblock names for it. Without
        # it the gate warns and continues — which is what it did on v3.85.0, comparing
        # against a 39-day baseline past its own BASELINE_STALE_AGE_DAYS = 30. A gate added
        # to stop a regression riding out with a release must not be able to pass by
        # comparing against evidence it has already judged unreliable.
        # Recapture: node benchmark/benchmark.mjs --production-hybrid > benchmark/baseline.json
        run: node benchmark/ci-gate.mjs --strict

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # required for npm provenance attestation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Generate npm-shrinkwrap (lock the published tarball)
        # Mirrors the validate job — see the rationale there. Must run before
        # `npm publish` (each job has its own checkout).
        run: npm shrinkwrap

      - name: Publish to npm
        # --provenance requires an OIDC-capable token (npm >=9.5). A legacy/classic
        # NPM_TOKEN fails the provenance step (lesson #8583 — past E404s here were
        # token issues). Default OFF for publish safety; opt in by setting the repo
        # variable NPM_PROVENANCE=true once the token is granular/automation-scoped
        # (the id-token: write permission above is harmless when provenance is OFF).
        run: |
          # Idempotency guard. `npm publish` errors on an existing version, so a job that
          # published successfully and then failed LATER (signing, or the GitHub release
          # step) could never be re-run: the retry died here instead of reaching the step
          # that actually failed. v3.69.0 and v3.69.1 both hit exactly that — npm publish
          # succeeded, then action-gh-release got 503 three times, and neither tag could
          # be recovered because the only path back ran through this step. One transient
          # GitHub outage permanently stranded a version. Skipping an already-published
          # version makes the whole job re-runnable; `validate` has already proved the tag
          # matches package.json, so "already there" means our own artifact, not someone
          # else's.
          PKG_NAME="$(node -p 'require("./package.json").name')"
          PKG_VER="$(node -p 'require("./package.json").version')"
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} is already on the registry — skipping publish and continuing to the release steps."
          elif [ "${NPM_PROVENANCE}" = "true" ]; then
            # Provenance needs an OIDC-capable (automation/granular) token. A classic
            # token can't attest and fails the provenance publish (lesson #8583). Rather
            # than block the release, fall back to a plain publish with a loud warning —
            # so enabling NPM_PROVENANCE is safe even before the token is confirmed.
            if npm publish --provenance --access public; then
              echo "Published with provenance."
            else
              echo "::warning::npm publish --provenance failed (token likely not automation/granular-scoped, see #8583) — retrying without provenance."
              npm publish --access public
            fi
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PROVENANCE: ${{ vars.NPM_PROVENANCE }}

      # P1 supply-chain: sign the release manifest. No-op (exits 0, writes nothing)
      # until the RELEASE_SIGNING_KEY secret is provisioned; action-gh-release then
      # skips the two missing files (fail_on_unmatched_files defaults to false).
      - name: Sign release manifest
        run: node scripts/sign-release.mjs
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: |
            release-manifest.json
            release-manifest.json.sig
